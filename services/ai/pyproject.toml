[project]
name = "lattice-ai"
version = "0.1.0"
description = "Lattice AI service: natural-language questions answered against the governed business-logic layer."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "grpcio>=1.85,<1.86",
    "grpcio-health-checking>=1.85,<1.86",
    "prometheus-client>=0.26",
    "protobuf>=6.31",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "uvicorn>=0.54",
]

[project.scripts]
lattice-ai = "lattice_ai.__main__:main"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85,<1.86",
    "httpx>=0.28",
    "mypy>=2.4",
    "mypy-protobuf>=5.1",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "types-grpcio>=1.85",
    "types-protobuf>=7.35",
    "watchfiles>=1.1",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `lattice` holds the protobuf contracts generated from packages/proto (scripts/gen.sh).
packages = ["src/lattice_ai", "src/lattice"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/lattice"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF", "SIM", "PT", "ANN"]
ignore = [
    "S104", # binding 0.0.0.0 is intended inside containers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["lattice_ai", "tests"]
explicit_package_bases = true

[[tool.mypy.overrides]]
# grpcio-health-checking ships no type information and typeshed has no stubs for it.
module = ["grpc_health.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Generated protobuf modules: mypy reads their .pyi stubs, never their bodies.
module = ["lattice.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
